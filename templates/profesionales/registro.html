{% extends "base.html" %}
{% block titulo %}Registro de profesional · StyleBook{% endblock %}
{% block contenido %}
  <section class="formulario-angosto">
    <h1>Regístrate como profesional</h1>
    <p>Completa estos datos para aparecer en el listado de profesionales del salón.</p>
    <form method="POST">
      <label for="especialidad">Especialidad</label>
      <input type="text" id="especialidad" name="especialidad"
             placeholder="Ej. Barbería, Colorimetría, Uñas" required />

      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" name="descripcion" rows="4"></textarea>

      <label for="telefono">Teléfono de contacto</label>
      <input type="tel" id="telefono" name="telefono" />

      <label for="anios_experiencia">Años de experiencia</label>
      <input type="number" id="anios_experiencia" name="anios_experiencia" min="0" value="0" />

      <button type="submit" class="boton">Completar registro</button>
    </form>
  </section>
{% endblock %}
