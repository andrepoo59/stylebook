{% extends "base.html" %}
{% block titulo %}{{ "Editar" if servicio else "Nuevo" }} servicio · StyleBook{% endblock %}

{% block contenido %}
  <h1>{{ "Editar servicio" if servicio else "Nuevo servicio" }}</h1>

  <form method="post">
    <label for="nombre">Nombre del servicio</label>
    <input type="text" id="nombre" name="nombre" required
           value="{{ servicio.nombre if servicio else '' }}"
           placeholder="Ej. Corte clásico, Manicure spa">

    <label for="categoria">Categoría</label>
    <input type="text" id="categoria" name="categoria"
           value="{{ servicio.categoria if servicio else '' }}"
           placeholder="Ej. cortes, color, uñas, barbería">

    <label for="descripcion">Descripción</label>
    <textarea id="descripcion" name="descripcion" rows="3">{{ servicio.descripcion if servicio else '' }}</textarea>

    <label for="precio">Precio</label>
    <input type="number" id="precio" name="precio" step="0.01" min="0" required
           value="{{ servicio.precio if servicio else '' }}">

    <label for="duracion_min">Duración (minutos)</label>
    <input type="number" id="duracion_min" name="duracion_min" min="10" max="480" required
           value="{{ servicio.duracion_min if servicio else '' }}">

    <button type="submit">{{ "Guardar cambios" if servicio else "Agregar servicio" }}</button>
  </form>
{% endblock %}
